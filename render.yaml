services:
  # 1. Python FastAPI ML Microservice
  - type: web
    name: heart-disease-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    plan: free

  # 2. Node.js Express API Bridge
  - type: web
    name: heart-disease-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: heart-disease-ml
          property: host
    plan: free

  # 3. React Vite Frontend
  - type: web
    name: heart-disease-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: heart-disease-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

