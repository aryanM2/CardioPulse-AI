services:
  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      PORT: 5000
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - ml-service

  ml-service:
    build:
      context: ./ml_service
    ports:
      - "8000:8000"